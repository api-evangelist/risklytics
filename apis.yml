name: Risklytics
description: >-
  Risklytics is an AI-native property and catastrophe risk company (Y Combinator Summer 2026, based in
  San Francisco, founded 2026 by Samuel Gold and Alexander Risio). It builds hyper-localized disaster
  risk models that simulate specific natural hazards - wildfire, flood, wind, earthquake, and debris
  runout - against individual home structures rather than ZIP-code averages, creating a per-structure
  digital twin from building footprints, lidar, and public records. Its Ember API returns property risk
  scores, modeled annual loss estimates, and retrofit-impact modeling used for insurance risk selection
  and portfolio triage (currently California-only, production model ember-1.3.0-firewall). The company
  also operates the FireCast platform and an AI-native brokerage for hard-to-place commercial insurance.
  API access is via a personal API key issued through the platform dashboard; there is no public
  OpenAPI, developer portal, or blog published to date, so this profile captures the company identity,
  the documented Ember API plans and authentication model, and the security posture of its web surface.
